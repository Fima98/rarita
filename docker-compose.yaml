services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PRODUCT_SERVICE_HOST=product:50051
      - USER_SERVICE_HOST=user:50052
    depends_on:
      - product
      - user

  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    ports:
      - "50051:50051"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rarita
    depends_on:
      - db

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "50052:50052"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rarita
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rarita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
