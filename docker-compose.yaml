services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PRODUCT_SERVICE_HOST=product:50051
      - USER_SERVICE_HOST=user:50052
    depends_on:
      - product
      - user

  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    ports:
      - "50051:50051"

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/user_db
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
