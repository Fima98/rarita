syntax = "proto3";
import "google/protobuf/struct.proto";

package product;

message CategoryResponse {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message CreateCategoryRequest {
  string name = 1;
}

message ProductVariant {
  string variant_id = 1;
  string sku = 2;
  string color_name = 3;
  string color_hex = 4;
  double price = 5;
  int32 stock = 6;
  int32 reserved_stock = 7;
  bool is_active = 8;
  repeated string images = 9;
}

message ProductRequest {
  string id = 1;
}

message ProductResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string category_id = 4;
  string category_name = 5;
  google.protobuf.Struct attributes = 6;
  repeated ProductVariant variants = 7;
  bool is_active = 8;
}

message ListProductsRequest {
  int32 limit = 1;
  int32 offset = 2;
  optional string category_id = 3;
}

message ListProductsResponse {
  repeated ProductResponse products = 1;
}

message CreateProductVariantInput {
  string sku = 1;
  string color_name = 2;
  string color_hex = 3;
  double price = 4;
  int32 stock = 5;
  repeated string images = 6;
}

message CreateProductVariantRequest {
  string product_id = 1;
  string sku = 2;
  string color_name = 3;
  string color_hex = 4;
  double price = 5;
  int32 stock = 6;
  repeated string images = 7;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  string category_id = 3;
  google.protobuf.Struct attributes = 4;
  repeated CreateProductVariantInput variants = 5;
}

message UpdateProductRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string category_id = 4;
  optional google.protobuf.Struct attributes = 5;
  optional bool is_active = 6;
}

message UpdateProductVariantRequest {
  string variant_id = 1;
  optional double price = 2;
  optional int32 stock = 3;
  optional int32 reserved_stock = 4;
  optional bool is_active = 5;
}

message DeleteProductRequest {
  string id = 1;
}

message DeleteProductResponse {
  bool success = 1;
  string message = 2;
}

message DeleteProductVariantRequest {
  string variant_id = 1;
}

message DeleteProductVariantResponse {
  bool success = 1;
  string message = 2;
}

service ProductService {
    rpc GetProduct(ProductRequest) returns (ProductResponse);
    rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
    rpc CreateProduct(CreateProductRequest) returns (ProductResponse);
    rpc CreateProductVariant(CreateProductVariantRequest) returns (ProductVariant);
    rpc UpdateProduct(UpdateProductRequest) returns (ProductResponse);
    rpc UpdateProductVariant(UpdateProductVariantRequest) returns (ProductVariant);
    rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
    rpc DeleteProductVariant(DeleteProductVariantRequest) returns (DeleteProductVariantResponse);
    rpc CreateCategory(CreateCategoryRequest) returns (CategoryResponse);
}