services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      - PRODUCT_SERVICE_HOST=product:50051
      - USER_SERVICE_HOST=user:50052
      - ORDER_SERVICE_HOST=order:50053
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8000"
    depends_on:
      - product
      - user
      - order

  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_product:5432/${PRODUCT_DB_NAME}
    depends_on:
      - db_product

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_user:5432/${USER_DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - db_user

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_order:5432/${ORDER_DB_NAME}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - PRODUCT_SERVICE_URL=product:50051
    depends_on:
      - db_order
      - rabbitmq
      - product

  db_product:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PRODUCT_DB_NAME}
    volumes:
      - postgres_product_data:/var/lib/postgresql/data

  db_user:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - postgres_user_data:/var/lib/postgresql/data

  db_order:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    volumes:
      - postgres_order_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_product_data:
  postgres_user_data:
  postgres_order_data:
  rabbitmq_data:
